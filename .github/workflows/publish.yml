name: Publish package

on:
  release:
    types: [published] # Trigger when a release is published
  workflow_dispatch: # Manual trigger runs everything except the actual publish (dry run)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - name: Simulate npm publish
        run: npm publish --dry-run --access public

  npm-publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # Ships npm 11.5.1+, required for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: 'npm'
      - run: npm ci
      # Authenticates via OIDC trusted publishing; no NPM_TOKEN needed. Provenance is generated automatically.
      - run: npm publish --access public
